<!-- v5 - Next-Level Polished & Bug-Free Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Jobs & Skill Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 32px 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 1280px; margin: 0 auto; }

        /* Header Styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-sub); margin-top: 6px; font-size: 15px; margin-bottom: 0; }

        .header-actions { display: flex; gap: 12px; }

        /* Buttons & Inputs */
        input, select, button {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            background: var(--card-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-primary { 
            background: var(--primary-color); 
            color: #ffffff; 
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary { 
            cursor: pointer; 
            font-weight: 600; 
            background: var(--card-bg);
        }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .kpi-card h4 { 
            margin: 0; 
            color: var(--text-sub); 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .kpi-card .value { 
            font-size: 28px; 
            font-weight: 700; 
            color: var(--primary-color); 
            margin-top: 10px; 
            line-height: 1.2;
        }

        /* Filter Controls Grid */
        .controls { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 16px; 
            margin-bottom: 32px; 
        }

        /* Chart Section Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }

        /* Table Design */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); text-align: left; font-size: 14px; }
        th { background: var(--bg-color); color: var(--text-sub); font-weight: 600; }

        /* Pagination Controls */
        .pagination { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .pagination-buttons { display: flex; gap: 10px; }

        /* Next-Level Mobile Optimization */
        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-actions { width: 100%; display: flex; justify-content: space-between; }
            .header-actions button { flex: 1; }
            .kpi-grid { grid-template-columns: 1fr; gap: 12px; }
            .controls { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
            .card { padding: 16px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Tech Jobs & Skill Analytics Dashboard</h1>
                <p class="subtitle">Real-time global market trends & compensation insights</p>
            </div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="toggleTheme()">🌓 Theme</button>
                <button class="btn-primary" onclick="exportCSV()">Download CSV</button>
            </div>
        </div>

        <!-- KPI Summary Cards -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <h4>Total Postings Loaded</h4>
                <div class="value" id="kpiTotalJobs">0</div>
            </div>
            <div class="kpi-card">
                <h4>Top Job Role</h4>
                <div class="value" id="kpiTopRole">-</div>
            </div>
            <div class="kpi-card">
                <h4>Top Location</h4>
                <div class="value" id="kpiTopLocation">-</div>
            </div>
        </div>

        <!-- Filters Block -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Search job titles..." onkeyup="filterData()">
            <select id="roleSelect" onchange="filterData()"><option value="">All Roles</option></select>
            <select id="locationSelect" onchange="filterData()"><option value="">All Locations</option></select>
            <select id="salarySelect" onchange="filterData()"><option value="">All Salary Brackets</option></select>
        </div>

        <!-- Dynamic Visual Analytics -->
        <div class="charts-grid">
            <div class="card">
                <h3>Job Titles Distribution</h3>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>Salary Brackets Distribution</h3>
                <div class="chart-container">
                    <canvas id="salaryChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>Top Locations Share</h3>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Live Raw Data Table -->
        <div class="card">
            <h3>Live Job Listings</h3>
            <div class="table-responsive">
                <table id="jobsTable">
                    <thead>
                        <tr>
                            <th>Job Title</th>
                            <th>Location</th>
                            <th>Salary Range ($)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            
            <div class="pagination">
                <span id="pageIndicator" style="font-size: 14px; color: var(--text-sub);">Page 1 of 1</span>
                <div class="pagination-buttons">
                    <button class="btn-secondary" id="prevBtn" onclick="changePage(-1)">Previous</button>
                    <button class="btn-secondary" id="nextBtn" onclick="changePage(1)">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allJobs = [], filteredJobs = [];
        let currentPage = 1;
        const rowsPerPage = 10;
        let barChartInstance = null, pieChartInstance = null, salaryChartInstance = null;

        async function initDashboard() {
            try {
                const res = await fetch('https://tech-jobs-dashboard.onrender.com/api/jobs');
                allJobs = await res.json();
                filteredJobs = [...allJobs];

                populateDropdowns();
                updateKPIs();
                renderCharts();
                renderTable();
            } catch (err) {
                console.error("Data Fetch Error:", err);
            }
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const nextTheme = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', nextTheme);
            localStorage.setItem('theme_pref', nextTheme);
        }

        if (localStorage.getItem('theme_pref') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        function populateDropdowns() {
            const roles = [...new Set(allJobs.map(j => String(j.JobTitle).trim()))].sort();
            const locations = [...new Set(allJobs.map(j => String(j.Location).trim()))].sort();
            const salaries = [...new Set(allJobs.map(j => String(j.Salary).trim()))].sort();

            const roleSelect = document.getElementById('roleSelect');
            roleSelect.innerHTML = '<option value="">All Roles</option>';
            roles.forEach(r => roleSelect.add(new Option(r, r)));

            const locSelect = document.getElementById('locationSelect');
            locSelect.innerHTML = '<option value="">All Locations</option>';
            locations.forEach(l => locSelect.add(new Option(l, l)));

            const salSelect = document.getElementById('salarySelect');
            salSelect.innerHTML = '<option value="">All Salary Brackets</option>';
            salaries.forEach(s => salSelect.add(new Option(s, s)));
        }

        function updateKPIs() {
            document.getElementById('kpiTotalJobs').innerText = filteredJobs.length;
            const roles = {}, locations = {};
            filteredJobs.forEach(j => {
                const title = String(j.JobTitle).trim();
                const loc = String(j.Location).trim();
                roles[title] = (roles[title] || 0) + 1;
                locations[loc] = (locations[loc] || 0) + 1;
            });

            document.getElementById('kpiTopRole').innerText = Object.keys(roles).length 
                ? Object.keys(roles).reduce((a, b) => roles[a] > roles[b] ? a : b) 
                : 'N/A';
                
            document.getElementById('kpiTopLocation').innerText = Object.keys(locations).length 
                ? Object.keys(locations).reduce((a, b) => locations[a] > locations[b] ? a : b) 
                : 'N/A';
        }

        function renderCharts() {
            const roleCounts = {}, locCounts = {}, salaryCounts = {};

            filteredJobs.forEach(j => {
                const title = String(j.JobTitle).trim();
                const loc = String(j.Location).trim();
                const sal = String(j.Salary).trim();

                roleCounts[title] = (roleCounts[title] || 0) + 1;
                locCounts[loc] = (locCounts[loc] || 0) + 1;
                salaryCounts[sal] = (salaryCounts[sal] || 0) + 1;
            });

            // 1. Job Titles Bar Chart
            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(roleCounts).slice(0, 6),
                    datasets: [{ label: 'Postings', data: Object.values(roleCounts).slice(0, 6), backgroundColor: '#2563eb', borderRadius: 6 }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { maxRotation: 40, minRotation: 20, font: { size: 10 } } },
                        y: { beginAtZero: true }
                    }
                }
            });

            // 2. Salary Distribution Bar Chart
            if (salaryChartInstance) salaryChartInstance.destroy();
            salaryChartInstance = new Chart(document.getElementById('salaryChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(salaryCounts).slice(0, 6),
                    datasets: [{ label: 'Count', data: Object.values(salaryCounts).slice(0, 6), backgroundColor: '#10b981', borderRadius: 6 }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { maxRotation: 40, minRotation: 20, font: { size: 10 } } },
                        y: { beginAtZero: true }
                    }
                }
            });

            // 3. Doughnut Chart
            if (pieChartInstance) pieChartInstance.destroy();
            const topLocations = Object.entries(locCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            pieChartInstance = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: {
                    labels: topLocations.map(l => l[0]),
                    datasets: [{ 
                        data: topLocations.map(l => l[1]), 
                        backgroundColor: ['#2563eb', '#3b82f6', '#60a5fa', '#93c5fd', '#cbd5e1'] 
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 12 } } }
                }
            });
        }

        function renderTable() {
            const tbody = document.querySelector('#jobsTable tbody');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = filteredJobs.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-sub);">No matching job postings found.</td></tr>`;
            } else {
                pageData.forEach(job => {
                    tbody.innerHTML += `<tr>
                        <td><strong>${job.JobTitle}</strong></td>
                        <td>${job.Location}</td>
                        <td>${job.Salary}</td>
                    </tr>`;
                });
            }

            const totalPages = Math.ceil(filteredJobs.length / rowsPerPage) || 1;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderTable();
        }

        function filterData() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const roleVal = document.getElementById('roleSelect').value.trim();
            const locVal = document.getElementById('locationSelect').value.trim();
            const salVal = document.getElementById('salarySelect').value.trim();

            filteredJobs = allJobs.filter(j => {
                const title = String(j.JobTitle || "").toLowerCase();
                const matchSearch = searchVal === "" || title.includes(searchVal);
                const matchRole = roleVal === "" || String(j.JobTitle).trim() === roleVal;
                const matchLoc = locVal === "" || String(j.Location).trim() === locVal;
                const matchSal = salVal === "" || String(j.Salary).trim() === salVal;

                return matchSearch && matchRole && matchLoc && matchSal;
            });

            currentPage = 1;
            updateKPIs(); 
            renderCharts(); 
            renderTable();
        }

        function exportCSV() {
            let csv = "Job Title,Location,Salary\n";
            filteredJobs.forEach(r => csv += `"${r.JobTitle}","${r.Location}","${r.Salary}"\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'filtered_job_data.csv';
            a.click();
        }

        initDashboard();
    </script>
</body>
</html>
